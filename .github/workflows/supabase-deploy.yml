name: Deploy — Supabase (migrations + functions)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link ao projeto
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Aplicar migrations
        run: supabase db push

      - name: Publicar Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"

    # Os secrets das functions (BREVO_API_KEY, BREVO_WEBHOOK_SECRET, etc.) são
    # definidos uma única vez via `supabase secrets set` — ver README.
